[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizagentbench"
version = "0.1.0"
description = "BizAgentBench payment-service agent benchmark"
requires-python = ">=3.12,<3.14"
# The vendored third_party/tau2-bench/src is put on sys.path by the code that uses it,
# so only its dependencies are listed here.
dependencies = [
  "httpx[socks]>=0.24",
  "jsonschema>=4.20",
  "markdown-it-py>=3,<5",
  "pandas>=2.2.3",
  "loguru>=0.7.3",
  "docstring-parser>=0.16",
  "litellm>=1.80.15",
  "deepdiff>=8.4.2",
  "addict>=2.4.0",
  "PyYAML>=6.0.2",
  "toml>=0.10.2",
  "python-dotenv>=1.0.0",
  "numpy>=1.24.0",
]

[dependency-groups]
dev = ["beaker-sdk>=0.6.6"]

[tool.hatch.build.targets.wheel]
packages = ["payment", "tools"]
